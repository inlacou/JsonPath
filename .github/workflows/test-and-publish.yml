name: KMP Test and Prepare for JitPack

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP Unit Tests (JVM)
        run: ./gradlew :JsonPath:jvmTest

      - name: Run KMP Unit Tests (iOS Simulator)
        if: runner.os == 'macOS'
        run: ./gradlew :JsonPath:iosSimulatorArm64Test

      # You can add more target tests here if you have runners for them
      # - name: Run KMP Unit Tests (iOS)
      #   run: ./gradlew :JsonPath:iosSimulatorArm64Test

      - name: Build JsonPath (JitPack check)
        run: ./gradlew :JsonPath:assemble

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: JsonPath/build/test-results/
